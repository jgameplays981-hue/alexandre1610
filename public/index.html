<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cursos e Alunos</title>
  <style>
    :root {
      --bg: #f0f3f6;
      --surface: #ffffff;
      --ink: #1a2332;
      --muted: #5c6b7a;
      --line: #d8e0e8;
      --primary: #0f6e56;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    .app { width: min(900px, calc(100% - 2rem)); margin: 0 auto; padding: 2rem 0 3rem; }
    h1 { margin: 0 0 .25rem; }
    .subtitulo { margin: 0 0 1.5rem; color: var(--muted); font-size: .9rem; }

    .painel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px -18px rgba(26, 35, 50, .45);
    }
    .painel + .painel { margin-top: 1.25rem; }
    .painel-cabecalho {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .75rem;
      padding: 1rem 1.15rem;
    }
    .painel-cabecalho h2 { margin: 0; font-size: 1rem; }
    .filtros { display: flex; align-items: center; gap: .5rem; }

    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: .75rem 1.15rem; border-bottom: 1px solid var(--line); }
    th { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: #f4f7fa; }
    th.acoes, td.acoes { text-align: right; }
    tbody tr:hover td { background: #f8fbfc; }
    .vazio { color: var(--muted); text-align: center; }

    select, .btn {
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: .45rem .75rem;
      background: #fff;
      color: var(--ink);
    }
    .btn { cursor: pointer; font-weight: 600; font-size: .85rem; }
    .btn:hover { border-color: var(--primary); }
    .btn-pequeno { padding: .3rem .6rem; font-size: .78rem; }

    /* frase embaixo da tabela de alunos */
    .rolagem-status {
      margin: 0;
      padding: .75rem 1.15rem;
      font-size: .8rem;
      color: var(--muted);
      border-top: 1px solid var(--line);
    }
    .rolagem-status.erro { color: #b42318; }

    @media (max-width: 640px) {
      .painel-cabecalho { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Cursos e Alunos</h1>
    <p class="subtitulo">
      Um curso tem vários alunos (1:N). A lista de alunos carrega ao rolar a tela.
    </p>

    <!-- Lado 1: cursos (carregam inteiros, são poucos) -->
    <section class="painel">
      <div class="painel-cabecalho">
        <h2>Cursos</h2>
      </div>
      <table>
        <thead>
          <tr><th>Curso</th><th>Alunos</th><th class="acoes">Ações</th></tr>
        </thead>
        <tbody id="tabela-cursos">
          <tr><td colspan="3" class="vazio">Carregando...</td></tr>
        </tbody>
      </table>
    </section>

    <!-- Lado N: alunos (carregam de 5 em 5 ao rolar) -->
    <section class="painel">
      <div class="painel-cabecalho">
        <h2>Alunos cadastrados</h2>
        <div class="filtros">
          <select id="filtro-curso">
            <option value="">Todos os cursos</option>
          </select>
          <button type="button" id="btn-atualizar" class="btn">Atualizar lista</button>
        </div>
      </div>
      <table>
        <thead>
          <tr><th>Nome</th><th>RA</th><th>Curso</th></tr>
        </thead>
        <tbody id="tabela-alunos"></tbody>
      </table>

      <!-- fala com a pessoa: "Mostrando 10 de 103..." -->
      <p id="alunos-status" class="rolagem-status">Carregando...</p>
      <!-- marcador invisível: quando aparece na janela, pedimos mais 5 -->
      <div id="sentinela-alunos" aria-hidden="true"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
